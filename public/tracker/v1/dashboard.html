<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc Practice Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>Calc Practice Dashboard</h1>

        <div class="toolbar">
            <a href="index.html">← Log a session</a>
            <button id="clear-btn" class="danger">Clear all data</button>
        </div>

        <p id="empty-message" class="empty" hidden>No sessions yet — log one first!</p>

        <div id="dashboard-grid" class="dashboard-grid">
            <section class="card chart-card">
                <canvas id="dailyChart"></canvas>
            </section>
            <section class="card chart-card">
                <canvas id="topicChart"></canvas>
            </section>
            <section class="card sketch-card">
                <div id="sketch-holder"></div>
            </section>
        </div>
    </main>

    <!-- sketch.js first so dashboard.js can call updateTower() -->
    <script src="js/sketch.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
